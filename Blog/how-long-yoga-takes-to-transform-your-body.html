    <style>
        :root {
            --primary: #4a7c59;
            --secondary: #8d9f87;
            --accent: #d0b49f;
            --light: #f4f1e9;
            --dark: #2d3319;
            --text: #333;
        }

        * {

        }

        body {

            background-color: var(--light);
            color: var(--text);
            line-height: 1.7;
        }

        header {
            background-color: white;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0 5%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .nav-links {

            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            font-size: 1.1rem;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary);
            border-radius: 2px;
        }

        .cta-button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .cta-button:hover {
            background-color: #3a6547;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(74, 124, 89, 0.3);
        }

            margin: 20px auto;
            padding: 0 20px;
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

            margin: 40px auto;
            padding: 0 20px;
        }

            margin-bottom: 40px;

            gap: 20px;

            font-size: 0.95rem;

            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;

            height: 100%;

            padding: 40px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.05);

            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background-color: var(--accent);
        }

            border-left: 4px solid var(--primary);
            padding: 20px;
            margin: 30px 0;
            border-radius: 0 8px 8px 0;
        }

            gap: 20px;
            align-items: center;
            margin: 50px 0 30px;
            padding: 20px;
            background: rgba(208, 180, 159, 0.1);
            border-radius: 12px;
        }

        .author-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
        }

        .author-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .author-info h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .author-info p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Newsletter */
        .newsletter {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            padding: 70px 0;
            text-align: center;
            color: white;
            margin: 80px 0;
        }

        .newsletter h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .newsletter p {
            max-width: 600px;
            margin: 0 auto 30px;
            font-size: 1.1rem;
        }

        .subscribe-form {
            display: flex;
            max-width: 500px;
            margin: 0 auto;
        }

        .subscribe-form input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 30px 0 0 30px;
            font-size: 1rem;
            outline: none;
        }

        .subscribe-form button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 0 30px 30px 0;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        .subscribe-form button:hover {
            background: #c0a088;
        }

        footer {
            background: var(--dark);
            color: white;
            padding: 60px 0 30px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }

        .footer-column h3 {
            font-size: 1.3rem;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }

        .footer-column h3::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 2px;
            background: var(--accent);
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 12px;
        }

        .footer-links a {
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: white;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-links a:hover {
            background: var(--accent);
            transform: translateY(-3px);
        }

        .copyright {
            text-align: center;
            padding-top: 40px;
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 20px;
                padding: 20px 0;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .blog-title {
                font-size: 2.3rem;
            }

            .featured-image {
                height: 300px;
            }

            .blog-content {
                padding: 30px 20px;
            }

            .author-section {
                flex-direction: column;
                text-align: center;
            }
        }

        .key-takeaways{background:#f4f7f6;border-left:4px solid #2c5f2d;padding:16px 20px;margin:0 0 28px;border-radius:4px;}
